[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyshell"
version = "0.1.0"
description = "A tiny from-scratch language model that turns natural language into Linux shell commands."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TinyShell" }]
dependencies = [
    "torch>=2.4",
    "tokenizers>=0.20",
    "numpy>=1.26",
    "PyYAML>=6.0",
    "matplotlib>=3.8",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
tinyshell = "tinyshell.cli:main"
tinyshell-prepare = "tinyshell.data:main"
tinyshell-tokenizer = "tinyshell.tokenizer:main"
tinyshell-train = "tinyshell.train:main"
tinyshell-eval = "tinyshell.evaluate:main"
tinyshell-package = "tinyshell.package:main"
tinyshell-plots = "tinyshell.plots:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
